name: Build and push Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Scale set "runner-bitwarden" (ARC, Docker-in-Docker). The runner sets
    # REGISTRY (registry host, no scheme) in its own environment.
    runs-on: runner-bitwarden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve registry from runner environment
        run: |
          : "${REGISTRY:?REGISTRY is not set in the runner environment}"
          echo "REGISTRY_HOST=${REGISTRY}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for bitwarden-portal
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_HOST }}/bitwarden-portal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Compute epoch tag
        id: epoch
        run: echo "TAG=$(date -u +%s)" >> $GITHUB_OUTPUT
      - name: Build and push bitwarden-portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY_HOST }}/bitwarden-portal:${{ steps.epoch.outputs.TAG }}
          labels: ${{ steps.meta.outputs.labels }}
