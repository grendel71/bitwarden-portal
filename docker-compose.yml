# Shared by the API and the worker. All values come from .env.
# The "environment" entries override .env: inside Docker, Redis is reachable at
# the service name "redis", while .env holds the host for running without Docker.
x-app-env: &app-env
  env_file:
    - .env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  redis:
    image: redis:7-alpine
    container_name: bitwarden-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  bitwarden_portal:
    build: .
    container_name: bitwarden-portal
    ports:
      - "4200:8000"
    depends_on:
      - redis
    volumes:
      - ./backups:/app/backups
    <<: *app-env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: bitwarden-worker
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./backups:/app/backups
    <<: *app-env
    command: rq worker

volumes:
  redis_data:
